<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tradição | Natal </title>
    <link rel="stylesheet" href="../style/style.css">
</head>

<body>
    <header class="cabecalho">
        <div class="container">
            <p class="etiqueta">Natal</p>

            <h1>Mande seu recado para o papai noel</h1>

            <nav class="menu-principal">
                <ul class="menu-lista">
                    <li><a class="menu-link" href="../index.html">Home</a></li>
                    <li><a class="menu-link" href="./tradicao.html">Tradição & Histórias</a></li>
                    <li><a class="menu-link" href="./contato.html">Contato</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <form>
            <fieldset>
                <legend>Dados Pessoais</legend>
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" placeholder="Digite seu nome completo">
                <br>

                <label for="filhos">Idade</label>
                <input type="number" id="filhos" min="1" max="30" step="0.5">
                <br>

                <label for="sexo">Sexo:</label>
                <input type="radio" id="sexo" name="sexo" value="M">Masculino
                <input type="radio" id="sexo" name="sexo" value="F">Feminino
                <br>

                <label for="boa">Foi uma boa criança?</label>
                <input type="radio" id="boa" name="boa" value="S">Sim
                <input type="radio" id="boa" name="boa" value="N">Não
                <br>

                <label for="estado">Estado</label>
                <select name="estado" id="estado">
                    <option value="0">Selecione</option>
                    <option value="SP">São Paulo</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="MG">Minas Gerais</option>
                </select>
            </fieldset>

            <fieldset>
                <legend>Mensagem</legend>
                <textarea name="msg" id="msg" cols="50" rows="10">Digite o que você quer do papai noel...</textarea>
                <br>
            </fieldset>

            <br>

            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">

        </form>
    </main>

        <div class="container">

            </address>
        </div>
    </footer>
</body>

</html>
